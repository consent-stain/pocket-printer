<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケットプリンター</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 通信制御 -->
  <div class="card">
    <div class="btn-group">
      <button id="btnConnect" type="button">プリンター接続</button>
      <button id="btnPrint" type="button" class="primary" disabled>印刷開始</button>
    </div>
  </div>

  <!-- 画像貼り付けエリア（画像バイナリ貼付専用） -->
  <div class="card">
    <div style="font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #495057;">コピーした画像の貼り付け</div>
    <div id="pasteZone" contenteditable="true" spellcheck="false" data-placeholder="ここを長押しして「貼り付け」&#10;（Webサイトで「画像をコピー」したデータをペースト）"></div>
    <div id="pasteHint" style="font-size: 11px; color: #6c757d; margin-top: 6px; line-height: 1.4;">
      ※Webページ上の画像を長押しして「画像をコピー」後、上の枠に貼り付けてください。
    </div>
  </div>

  <!-- 印刷設定・ファイル選択 -->
  <div class="card">
    <div class="field-row">
      <span>印刷サイズ / オプション</span>
      <select id="modeSelect">
        <option value="free" selected>用紙幅に合わせる (自動)</option>
        <option value="fixed-fit">5×3 cm (全体表示)</option>
        <option value="fixed-crop">5×3 cm (上下位置調整)</option>
        <option value="fixed-4x6-fit">4×6 cm (全体表示・左右反転)</option>
        <option value="fixed-4x6-crop">4×6 cm (上下位置調整・左右反転)</option>
      </select>
    </div>

    <div id="offsetControl">
      <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
        <span>印刷範囲の上下調整</span>
        <span id="offsetVal">中央</span>
      </div>
      <input type="range" id="offsetRange" min="0" max="100" value="50" style="width: 100%;">
    </div>

    <div id="selectZone">
      端末内の画像ファイルを選択
      <input type="file" id="fileInput" accept="image/*" style="display: none;">
    </div>
  </div>

  <!-- プレビュー -->
  <canvas id="previewCanvas" width="384" height="120"></canvas>
  <div id="status">プリンターに接続してください</div>

  <script src="app.js"></script>
</body>
</html>
