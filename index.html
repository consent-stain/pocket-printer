<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケットプリンター</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 通信制御 -->
  <div class="card">
    <div class="btn-group">
      <button id="btnConnect" type="button">プリンター接続</button>
      <button id="btnPrint" type="button" class="primary" disabled>印刷開始</button>
    </div>
  </div>

  <!-- 貼り付けエリア（画像・URL両対応） -->
  <div class="card">
    <div id="pasteZone" contenteditable="true" spellcheck="false" data-placeholder="ここを長押しして「貼り付け」&#10;（画像バイナリ / 画像URL どちらも対応）"></div>
  </div>

  <!-- 印刷設定・ファイル選択 -->
  <div class="card">
    <div class="field-row">
      <span>印刷サイズ</span>
      <select id="modeSelect">
        <option value="free" selected>用紙幅に合わせる (自動)</option>
        <option value="fixed-fit">5×3 cm (縮小して全体印刷)</option>
        <option value="fixed-crop">5×3 cm (用紙幅に合わせて上下調整)</option>
      </select>
    </div>

    <div id="offsetControl">
      <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
        <span>印刷範囲の上下調整</span>
        <span id="offsetVal">中央</span>
      </div>
      <input type="range" id="offsetRange" min="0" max="100" value="50" style="width: 100%;">
    </div>

    <div id="selectZone">
      端末内の画像ファイルを選択
      <input type="file" id="fileInput" accept="image/*" style="display: none;">
    </div>
  </div>

  <!-- プレビュー -->
  <canvas id="previewCanvas" width="384" height="120"></canvas>
  <div id="status">プリンターに接続してください</div>

  <script src="app.js"></script>
</body>
</html>
