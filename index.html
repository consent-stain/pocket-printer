<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d6efd">
  <title>ポケットプリンター</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 通信制御・PWAインストール -->
  <div class="card">
    <div class="btn-group">
      <button id="btnInstall" type="button" class="btn-install" style="display: none;">アプリをインストール</button>
      <button id="btnConnect" type="button">プリンター接続</button>
      <button id="btnPrint" type="button" class="primary" disabled>印刷開始</button>
    </div>
  </div>

  <!-- 画像URL入力 -->
  <div class="card">
    <div class="field-row">
      <span style="font-weight: bold;">画像URLから取得</span>
    </div>
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="画像URLを入力または長押しペースト">
      <button id="btnLoadUrl" type="button" class="primary" style="flex: none; width: 64px;">読込</button>
    </div>
    <div class="help-text">
      ※Web上の画像アドレスやBase64（data:image/...）形式に対応しています。
    </div>
  </div>

  <!-- 印刷設定・ファイル選択 -->
  <div class="card">
    <div class="field-row">
      <span>印刷サイズ</span>
      <select id="modeSelect">
        <option value="free" selected>用紙幅に合わせる (自動)</option>
        <option value="fixed-fit">5×3 cm (縮小して全体印刷)</option>
        <option value="fixed-crop">5×3 cm (用紙幅に合わせて上下調整)</option>
      </select>
    </div>

    <div id="offsetControl">
      <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
        <span>印刷範囲の上下調整</span>
        <span id="offsetVal">中央</span>
      </div>
      <input type="range" id="offsetRange" min="0" max="100" value="50" style="width: 100%;">
    </div>

    <div id="selectZone">
      端末内の画像ファイルを選択
      <input type="file" id="fileInput" accept="image/*" style="display: none;">
    </div>
  </div>

  <!-- プレビュー -->
  <canvas id="previewCanvas" width="384" height="120"></canvas>
  <div id="status">プリンターに接続してください</div>

  <!-- 診断ログバー -->
  <div id="diagBar" class="diag-box">
    <div style="font-weight: bold; margin-bottom: 4px;">PWAステータス診断:</div>
    <div id="diagContent">診断中...</div>
    <button id="btnClearCache" type="button" style="margin-top: 8px; padding: 4px 8px; font-size: 11px; background: #6c757d; color: #fff;">キャッシュ強制リフレッシュ</button>
  </div>

  <script>
    const logBox = document.getElementById('diagContent');
    function appendLog(msg) {
      if (logBox) {
        if (logBox.textContent === '診断中...') logBox.innerHTML = '';
        const div = document.createElement('div');
        div.textContent = msg;
        logBox.appendChild(div);
      }
    }

    // Manifestタグの動的確保（タグが消えている場合の自己修復）
    let mLink = document.querySelector('link[rel="manifest"]');
    if (!mLink) {
      appendLog('・警告: 静的タグ欠落 -> 動的注入実行');
      mLink = document.createElement('link');
      mLink.rel = 'manifest';
      mLink.href = 'manifest.json';
      document.head.appendChild(mLink);
    }

    // キャッシュ強制クリアボタン
    document.getElementById('btnClearCache').onclick = async () => {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (let r of regs) await r.unregister();
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        for (let k of keys) await caches.delete(k);
      }
      alert('キャッシュとSWを完全消去しました。ページを再読込します。');
      window.location.reload(true);
    };

    (async () => {
      // 1. Service Worker 登録
      if ('serviceWorker' in navigator) {
        try {
          const reg = await navigator.serviceWorker.register('sw.js?v=16');
          appendLog('・SW登録: OK (' + (reg.active ? '稼働中' : '更新待機中') + ')');
        } catch (err) {
          appendLog('・SW登録エラー: ' + err.message);
        }
      }

      // 2. Manifest 疎通
      try {
        const res = await fetch(mLink.href + '?t=' + Date.now());
        if (!res.ok) {
          appendLog('・Manifest取得失敗: HTTP ' + res.status);
        } else {
          const data = await res.json();
          appendLog('・Manifest読込: OK (' + data.short_name + ')');
          
          if (data.icons && data.icons.length > 0) {
            const iconUrl = new URL(data.icons[0].src, window.location.href).href;
            const imgRes = await fetch(iconUrl);
            appendLog('・アイコン取得: HTTP ' + imgRes.status);
          }
        }
      } catch (e) {
        appendLog('・Manifest通信エラー: ' + e.message);
      }

      // 3. インストール待機監視
      setTimeout(() => {
        if (!window.hasInstallPrompt) {
          appendLog('・プロンプト: 待機中（Chromeの判定処理中）');
        }
      }, 3000);
    })();

    window.addEventListener('beforeinstallprompt', (e) => {
      window.hasInstallPrompt = true;
      appendLog('★インストール資格OK！ボタンを押せます');
    });
  </script>

  <script src="app.js"></script>
</body>
</html>
