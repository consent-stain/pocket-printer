<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d6efd">
  <title>ポケットプリンター</title>
  <link rel="manifest" href="/pocket-printer/manifest.json">
  <link rel="icon" href="/pocket-printer/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/pocket-printer/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 通信制御・PWAインストール -->
  <div class="card">
    <div class="btn-group">
      <button id="btnInstall" type="button" class="btn-install" style="display: none;">アプリをインストール</button>
      <button id="btnConnect" type="button">プリンター接続</button>
      <button id="btnPrint" type="button" class="primary" disabled>印刷開始</button>
    </div>
  </div>

  <!-- 画像URL入力 -->
  <div class="card">
    <div class="field-row">
      <span style="font-weight: bold;">画像URLから取得</span>
    </div>
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="画像URLを入力または長押しペースト">
      <button id="btnLoadUrl" type="button" class="primary" style="flex: none; width: 64px;">読込</button>
    </div>
    <div class="help-text">
      ※Web上の画像アドレスやBase64（data:image/...）形式に対応しています。
    </div>
  </div>

  <!-- 印刷設定・ファイル選択 -->
  <div class="card">
    <div class="field-row">
      <span>印刷サイズ</span>
      <select id="modeSelect">
        <option value="free" selected>用紙幅に合わせる (自動)</option>
        <option value="fixed-fit">5×3 cm (縮小して全体印刷)</option>
        <option value="fixed-crop">5×3 cm (用紙幅に合わせて上下調整)</option>
      </select>
    </div>

    <div id="offsetControl">
      <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
        <span>印刷範囲の上下調整</span>
        <span id="offsetVal">中央</span>
      </div>
      <input type="range" id="offsetRange" min="0" max="100" value="50" style="width: 100%;">
    </div>

    <div id="selectZone">
      端末内の画像ファイルを選択
      <input type="file" id="fileInput" accept="image/*" style="display: none;">
    </div>
  </div>

  <!-- プレビュー -->
  <canvas id="previewCanvas" width="384" height="120"></canvas>
  <div id="status">プリンターに接続してください</div>

  <!-- 確実に出力される自己完結型デバッグパネル -->
  <div id="diagBar" class="diag-box">
    <div style="font-weight: bold; margin-bottom: 4px;">PWAステータス診断:</div>
    <div id="diagContent">診断中...</div>
  </div>

  <script>
    // app.jsがクラッシュしても絶対に画面にログを残すインライン診断機構
    const logBox = document.getElementById('diagContent');
    function appendLog(msg) {
      if (logBox) {
        if (logBox.textContent === '診断中...') logBox.innerHTML = '';
        const div = document.createElement('div');
        div.textContent = msg;
        logBox.appendChild(div);
      }
    }

    window.addEventListener('error', (e) => {
      appendLog('[JSエラー] ' + e.message);
    });

    (async () => {
      // 1. Service Worker 登録と状態
      if ('serviceWorker' in navigator) {
        try {
          const reg = await navigator.serviceWorker.register('/pocket-printer/sw.js', { scope: '/pocket-printer/' });
          appendLog('・SW登録: 成功 (' + (reg.active ? '稼働中' : '準備中') + ')');
        } catch (err) {
          appendLog('・SW登録失敗: ' + err.message);
        }
      } else {
        appendLog('・SW: ブラウザ非対応');
      }

      // 2. Manifest 疎通とJSON検証
      const link = document.querySelector('link[rel="manifest"]');
      if (!link) {
        appendLog('・Manifest: タグなし');
      } else {
        try {
          const res = await fetch(link.href);
          if (!res.ok) {
            appendLog('・Manifest取得失敗: HTTP ' + res.status);
          } else {
            const data = await res.json();
            appendLog('・Manifest読込: OK (' + data.short_name + ')');
            
            // 3. アイコン取得テスト
            if (data.icons && data.icons.length > 0) {
              const imgRes = await fetch(data.icons[0].src);
              appendLog('・アイコン取得: HTTP ' + imgRes.status + ' (' + imgRes.type + ')');
            } else {
              appendLog('・アイコン: 未定義');
            }
          }
        } catch (e) {
          appendLog('・Manifestパースエラー: ' + e.message);
        }
      }

      // 4. インストール待機状態
      setTimeout(() => {
        if (!window.hasInstallPrompt) {
          appendLog('・インストールプロンプト: 未受信（Chrome判定保留中または非対象）');
        }
      }, 2500);
    })();

    window.addEventListener('beforeinstallprompt', (e) => {
      window.hasInstallPrompt = true;
      appendLog('★インストールプロンプト受信完了！ボタン表示可');
    });
  </script>

  <script src="app.js"></script>
</body>
</html>
