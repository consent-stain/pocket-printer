<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d6efd">
  <title>ポケットプリンター</title>
  <link rel="manifest" href="/pocket-printer/manifest.json">
  <link rel="icon" href="/pocket-printer/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/pocket-printer/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 通信制御・PWAインストール -->
  <div class="card">
    <div class="btn-group">
      <button id="btnInstall" type="button" class="btn-install" style="display: none;">アプリをインストール</button>
      <button id="btnConnect" type="button">プリンター接続</button>
      <button id="btnPrint" type="button" class="primary" disabled>印刷開始</button>
    </div>
  </div>

  <!-- 画像URL入力 -->
  <div class="card">
    <div class="field-row">
      <span style="font-weight: bold;">画像URLから取得</span>
    </div>
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="画像URLを入力または長押しペースト">
      <button id="btnLoadUrl" type="button" class="primary" style="flex: none; width: 64px;">読込</button>
    </div>
    <div class="help-text">
      ※Web上の画像アドレスやBase64（data:image/...）形式に対応しています。
    </div>
  </div>

  <!-- 印刷設定・ファイル選択 -->
  <div class="card">
    <div class="field-row">
      <span>印刷サイズ</span>
      <select id="modeSelect">
        <option value="free" selected>用紙幅に合わせる (自動)</option>
        <option value="fixed-fit">5×3 cm (縮小して全体印刷)</option>
        <option value="fixed-crop">5×3 cm (用紙幅に合わせて上下調整)</option>
      </select>
    </div>

    <div id="offsetControl">
      <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
        <span>印刷範囲の上下調整</span>
        <span id="offsetVal">中央</span>
      </div>
      <input type="range" id="offsetRange" min="0" max="100" value="50" style="width: 100%;">
    </div>

    <div id="selectZone">
      端末内の画像ファイルを選択
      <input type="file" id="fileInput" accept="image/*" style="display: none;">
    </div>
  </div>

  <!-- プレビュー -->
  <canvas id="previewCanvas" width="384" height="120"></canvas>
  <div id="status">プリンターに接続してください</div>

  <!-- メンテナンス＆診断パネル -->
  <div class="card" style="margin-top: 14px; background: #f8f9fa;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
      <span style="font-size: 12px; font-weight: bold; color: #495057;">システム診断 / 管理</span>
      <button id="btnClearCache" type="button" class="btn-clear-cache">キャッシュ削除・再読込</button>
    </div>
    <div id="diagContent" style="font-size: 11px; color: #6c757d; font-family: monospace; line-height: 1.5;">診断待機中...</div>
  </div>

  <script>
    const logBox = document.getElementById('diagContent');
    function logState(msg) {
      if (logBox) {
        if (logBox.textContent === '診断待機中...') logBox.innerHTML = '';
        const div = document.createElement('div');
        div.textContent = msg;
        logBox.appendChild(div);
      }
    }

    // Manifestタグの動的確保
    let mLink = document.querySelector('link[rel="manifest"]');
    if (!mLink) {
      logState('・Manifestタグを自動生成しました');
      mLink = document.createElement('link');
      mLink.rel = 'manifest';
      mLink.href = '/pocket-printer/manifest.json';
      document.head.appendChild(mLink);
    }

    // キャッシュ強制クリア
    document.getElementById('btnClearCache').onclick = async () => {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const r of regs) await r.unregister();
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        for (const k of keys) await caches.delete(k);
      }
      alert('キャッシュを消去しました。再読込します。');
      window.location.reload(true);
    };

    (async () => {
      if ('serviceWorker' in navigator) {
        try {
          const reg = await navigator.serviceWorker.register('/pocket-printer/sw.js?v=19', { scope: '/pocket-printer/' });
          logState('・SW: 正常登録 (' + (reg.active ? '稼働中' : '準備中') + ')');
        } catch (err) {
          logState('・SW登録エラー: ' + err.message);
        }
      }
      try {
        const res = await fetch(mLink.href + '?t=' + Date.now());
        if (res.ok) {
          const j = await res.json();
          logState('・Manifest: OK (' + j.short_name + ')');
        } else {
          logState('・Manifest取得失敗: HTTP ' + res.status);
        }
      } catch (e) {
        logState('・Manifestエラー: ' + e.message);
      }
    })();

    window.addEventListener('beforeinstallprompt', (e) => {
      window.hasPrompt = true;
      logState('★インストール資格OK！ボタンを押せます');
    });
  </script>
  <script src="app.js"></script>
</body>
</html>
