<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケットプリンター</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 通信制御 -->
  <div class="card">
    <div class="btn-group">
      <button id="btnConnect" type="button">プリンター接続</button>
      <button id="btnPrint" type="button" class="primary" disabled>印刷開始</button>
    </div>
  </div>

  <!-- ナビゲーションタブ -->
  <div class="tab-nav">
    <button type="button" class="tab-btn active" data-tab="tab-paste">画像リンク貼付</button>
    <button type="button" class="tab-btn" data-tab="tab-file">画像ファイル</button>
    <button type="button" class="tab-btn" data-tab="tab-text">文字入力</button>
  </div>

  <!-- タブ1: 画像貼り付け -->
  <div id="tab-paste" class="tab-content active">
    <div class="card">
      <div style="font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #495057;">画像・画像リンクの貼り付け</div>
      <div id="pasteZone" contenteditable="true" spellcheck="false" data-placeholder="ここを長押しして「貼り付け」&#10;（コピーした画像 / Discordなどの画像リンク）"></div>
      <div class="help-text" style="margin-top: 6px;">
        ※「画像をコピー」したデータや、Discord等の画像リンク（cdn.discordapp.com等）を長押しペーストできます。
      </div>
    </div>
  </div>

  <!-- タブ2: 端末内の画像ファイル選択 -->
  <div id="tab-file" class="tab-content">
    <div class="card">
      <div id="selectZone">
        📁 ここをタップして端末内の画像を選択
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
      </div>
    </div>
  </div>

  <!-- タブ3: 文字入力（箇条書き・自動可変） -->
  <div id="tab-text" class="tab-content">
    <div class="card">
      <div style="font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #495057;">箇条書きリスト印刷</div>
      <div id="textListContainer">
        <!-- JSで可変入力欄を動的生成 -->
      </div>
      <div class="btn-group" style="margin-top: 8px;">
        <button id="btnAddRow" type="button" class="secondary">+ 項目を追加</button>
        <button id="btnClearText" type="button">全クリア</button>
      </div>
      <div class="help-text" style="margin-top: 8px;">
        ※自動で先頭に中点「・」が付与されます。文字サイズは最長行に合わせて均一に自動調整され、項目の数に応じて長さも自動可変します。
      </div>
    </div>
  </div>

  <!-- 印刷設定（画像タブ選択時のみ表示） -->
  <div id="imageSettingsCard" class="card">
    <div class="field-row">
      <span>印刷サイズ / オプション</span>
      <select id="modeSelect">
        <option value="free" selected>用紙幅に合わせる (自動)</option>
        <option value="fixed-fit">5×3 cm (全体表示)</option>
        <option value="fixed-crop">5×3 cm (上下位置調整)</option>
        <option value="fixed-5x6-fit">5×6 cm (全体表示・左右反転)</option>
        <option value="fixed-5x6-crop">5×6 cm (上下位置調整・左右反転)</option>
      </select>
    </div>

    <div id="offsetControl">
      <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
        <span>印刷範囲の上下調整</span>
        <span id="offsetVal">中央</span>
      </div>
      <input type="range" id="offsetRange" min="0" max="100" value="50" style="width: 100%;">
    </div>
  </div>

  <!-- プレビュー -->
  <canvas id="previewCanvas" width="384" height="120"></canvas>
  <div id="status">プリンターに接続してください</div>

  <script src="app.js"></script>
</body>
</html>
